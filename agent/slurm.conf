# Zabbix agent UserParameters for the "Slurm cluster by Zabbix agent" template.
#
# Install as:
#   /etc/zabbix/zabbix_agentd.d/slurm.conf     (Zabbix agent)
#   /etc/zabbix/zabbix_agent2.d/slurm.conf     (Zabbix agent 2)
#
# The agent must run on a host that has the Slurm client commands (scontrol,
# squeue, sdiag, sacctmgr) installed and configured, typically the controller
# or a login node.  No privileges beyond an ordinary user account are needed:
# the collector only reads cluster state.
#
# IMPORTANT - agent timeout
# -------------------------
# Querying Slurm can take longer than the default agent timeout of 3 seconds on
# a busy cluster.  Raise it in zabbix_agentd.conf / zabbix_agent2.conf:
#
#   Timeout=30
#
# On clusters where even 30 seconds is not enough, or where the extra squeue
# call at every cache expiry is unwelcome, switch to the timer based setup
# described at the bottom of this file.

UserParameter=slurm.cluster,/usr/local/bin/slurm_zabbix.py --mode cluster --cache-file /var/lib/zabbix-slurm/cache.json --cache-ttl 55
UserParameter=slurm.nodes,/usr/local/bin/slurm_zabbix.py --mode nodes --cache-file /var/lib/zabbix-slurm/cache.json --cache-ttl 55

# Both keys read the same cache, so a single Slurm query serves both master
# items.  --cache-ttl 55 matches the 1 minute interval of the master item.

# Timer based collection (recommended above a few hundred nodes)
# --------------------------------------------------------------
# Let systemd refresh the cache in the background and make the agent read the
# cache only, which makes every agent check return immediately:
#
#   1. install systemd/zabbix-slurm-collector.{service,timer} and enable the
#      timer:  systemctl enable --now zabbix-slurm-collector.timer
#   2. comment out the two UserParameter lines above and uncomment these:
#
# UserParameter=slurm.cluster,/usr/local/bin/slurm_zabbix.py --mode cluster --cache-file /var/lib/zabbix-slurm/cache.json --cache-only
# UserParameter=slurm.nodes,/usr/local/bin/slurm_zabbix.py --mode nodes --cache-file /var/lib/zabbix-slurm/cache.json --cache-only
#
# With --cache-only the collector never runs a Slurm command itself.  If the
# timer stops refreshing the cache, the template raises "Slurm: Collected data
# is stale" rather than silently reporting old numbers.

# Clusters without accounting
# ---------------------------
# Add --no-sacctmgr to both lines when the cluster runs without slurmdbd.  QOS
# discovery then only reports the QOS names currently used by jobs, and the
# "slurmdbd availability" item stays at 0, so disable its trigger as well.
