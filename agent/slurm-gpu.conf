# Zabbix agent UserParameter for the "Slurm GPU node by Zabbix agent" template.
#
# Install on the GPU compute nodes, as:
#   /etc/zabbix/zabbix_agent2.d/plugins.d/slurm-gpu.conf   (Zabbix agent 2)
#   /etc/zabbix/zabbix_agentd.d/slurm-gpu.conf             (Zabbix agent)
#
# This is the one part of the package that has to run on the compute nodes.
# Slurm knows which GPUs it handed to jobs; it has no idea what those GPUs are
# doing, and nothing on the controller can find out. nvidia-smi has to be run
# where the GPUs are.
#
# Needs on each GPU node: the Zabbix agent, nvidia-smi, and the Slurm client
# commands (scontrol and sinfo, for the allocation half of the comparison).

UserParameter=slurm.gpu,/usr/local/bin/slurm_zabbix.py --mode gpu --cache-file /var/lib/zabbix-slurm/cache.json --cache-ttl 55

# Node name
# ---------
# The allocation is looked up under the node's short hostname. If Slurm knows
# the node by another name, say so explicitly, otherwise allocation reads zero
# while utilisation still works:
#
# UserParameter=slurm.gpu,/usr/local/bin/slurm_zabbix.py --mode gpu --node gpu001 --cache-file /var/lib/zabbix-slurm/cache.json --cache-ttl 55
#
# The "Slurm GPU: Node name" item shows which name was used.

# Idle threshold
# --------------
# A GPU below 5% counts as idle, which is what "allocated but idle" is measured
# against. Add --gpu-idle-below N to change it, and set {$SLURM.GPU.IDLE.BELOW}
# on the host to match so the item descriptions stay honest.

# Nodes without GPUs
# ------------------
# Do not link the template to them: nvidia-smi is missing, the collector reports
# the error, and "Collector reported errors" fires.
